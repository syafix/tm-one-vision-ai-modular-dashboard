[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcp-openapi-adapter"
version = "0.1.0"
description = "Secure Python adapter for HikCentral Professional OpenAPI V3.1.1"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-httpx>=0.30,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "pip-audit>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/hcp_adapter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
