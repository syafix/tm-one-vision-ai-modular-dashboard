[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="vision-ai-dashboard-api"
version="0.1.0"
requires-python=">=3.12"
dependencies=[
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
 "asyncpg>=0.29,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
 "pyjwt[crypto]>=2.9,<3", "httpx>=0.27,<1"
]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<1","ruff>=0.7,<1"]
[tool.hatch.build.targets.wheel]
packages=["app"]
[tool.pytest.ini_options]
pythonpath=["."]
asyncio_mode="auto"
[tool.ruff]
line-length=100
